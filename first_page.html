<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Habit Tracker Dashboard</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <header class="header">
        <h1>Habit Tracker</h1>
        <p>Your consistency defines you</p>
    </header>

    <main class="dashboard">
        <section class="performance">
            <div class="circle">
                <span>72%</span>
                <p>Overall Performance</p>
            </div>

            <div class="line-progress">
                <div class="line-fill"></div>
            </div>
            <p class="week-label">Weekly Progress</p>
        </section>

        <!-- CARDS SECTION -->
        <section class="cards">

            <a href="to-do-list" class="card">
                <h2>To-Do List</h2>
                <p>Plan and complete daily tasks</p>
            </a>

            <a href="#" class="card">
                <h2>Habit Streak</h2>
                <p>Track your daily consistency</p>
            </a>

            <a href="#" class="card">
                <h2>Weekly Progress</h2>
                <p>Analyze your performance</p>
            </a>

            <a href="#" class="card">
                <h2>Insights</h2>
                <p>View productivity patterns</p>
            </a>

        </section>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>Stay consistent. Stay focused.</p>
    </footer>

</body>
</html>
