<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List | Habit Tracker</title>
    <link rel="stylesheet" href="list-style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <h1>To-Do List</h1>
        <p>Small tasks. Big consistency.</p>
    </header>

    <!-- TODO CONTAINER -->
    <main class="todo-container">

        <!-- ADD TASK -->
        <section class="add-task">
            <input type="text" placeholder="Add a new task...">
            <button>Add</button>
        </section>

        <!-- TASK LIST -->
        <section class="task-list">

            <div class="task completed">
                <label>
                    <input type="checkbox" checked>
                    <span>Morning workout</span>
                </label>
                <small>Done</small>
            </div>

            <div class="task">
                <label>
                    <input type="checkbox">
                    <span>Study DBMS normalization</span>
                </label>
                <small>Pending</small>
            </div>

            <div class="task">
                <label>
                    <input type="checkbox">
                    <span>Revise DSA concepts</span>
                </label>
                <small>Pending</small>
            </div>

            <div class="task">
                <label>
                    <input type="checkbox">
                    <span>Read for 30 minutes</span>
                </label>
                <small>Pending</small>
            </div>

        </section>

    </main>

</body>
</html>
